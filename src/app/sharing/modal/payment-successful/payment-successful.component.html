<div class="payment-successful-container">
  <div class="vertical-container">
    <div class="icon-container horizontal-container">
      <mat-icon>check_circle_outline</mat-icon>
    </div>
    <div class="content-container vertical-container">
      <div class="text">
        <h3 i18n>ĐẶT HÀNG THÀNH CÔNG</h3>
        <p i18n>Đơn hàng {{ orderModel.code }} đã được gửi!</p>
        <p i18n>Cảm ơn Quý Khách đã đặt hàng!</p>
      </div>
      <div class="button-container horizontal-container">
        <button mat-button (click)="goOrderHistory()" i18n>Lịch sử mua hàng</button>
        <div class="width-space"></div>
        <button mat-button (click)="dialogRef.close()" i18n>Đóng</button>
      </div>
    </div>
  </div>
</div>
