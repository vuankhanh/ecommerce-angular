<div class="slide-container">
  @if (slideShow$ | async; as slideShow) {
    <owl-carousel-o [options]="customOptions">
      @for (media of slideShow.media; track $index; let i=$index) {
      <ng-template carouselSlide>
        <div class="item-slide-container">
          <img [src]="media.url | prefixBackendStatic" [alt]="slideShow.name">
        </div>
      </ng-template>
      }
    </owl-carousel-o>
  }
</div>
