<div class="slide-container">
  <owl-carousel-o [options]="customOptions">
    @for (product of productHightlights; track $index; let i=$index) {
    <ng-template carouselSlide>
      <div class="item-slide-container" (click)="showDetail(product)">
        <img [src]="product.albumBanner!.src | galleryRoute" [alt]="product.name">
      </div>
    </ng-template>
    }
  </owl-carousel-o>
</div>
