<div class="product-container">
  @if(productCategorise$ | async; as productCategorys) {
    <div class="product-cagatory-container vertical-container">
      <div class="flex-me">
        <ng-container *ngFor="let category of productCategorys; let i = index;">
          <div class="product-category-frame" [routerLink]="['/san-pham/'+category.slug]"
            [routerLinkActive]="['is-active']">
            <div class="vertical-container">
              <div class="img-container horizontal-container">
                <img [src]="category.album.thumbnailUrl | prefixBackendStatic" [alt]="category.name" (load)="dosomething($event)">
              </div>
              <div class="product-info">
                <h2>{{ category.name }}</h2>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  }
  <div class="product-router-container vertical-container">
    <router-outlet></router-outlet>
  </div>
</div>
