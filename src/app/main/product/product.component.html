<div class="product-container">
  <app-bread-crumb></app-bread-crumb>
  @if(productCategorise$ | async; as productCategorys) {
  <mat-card class="categories-card">
    <mat-card-header>
      <mat-card-title i18n>Danh mục sản phẩm</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <div class="categories-grid">
        @for (category of productCategorys; track $index; let index = $index) {
        <mat-card class="category-card" [routerLink]="['/san-pham/'+category.slug]" [routerLinkActive]="['is-active']"
          mat-ripple>
          <mat-card-header>
            <div mat-card-avatar class="category-avatar">
              <img [src]="category.album.thumbnailUrl | prefixBackendStatic" [alt]="category.name"
                (load)="dosomething($event)">
            </div>
            <mat-card-title>{{ category.name }}</mat-card-title>
          </mat-card-header>
        </mat-card>
        }
      </div>
    </mat-card-content>
  </mat-card>
  }
  <div class="product-router-container vertical-container">
    <router-outlet></router-outlet>
  </div>
</div>
